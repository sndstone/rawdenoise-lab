    defect_probability: 0.5
    defect_options: *def_opts
    resite: false
    kind: camera
    manifest: data/bootstrap_binned_a7/a7m3_bin4_train.json
    calibration: calib/darks_physnoise_20261101.yaml
    cameras:
      a7m3: 0.50
      a5100: 0.50
    camera_options: *cam_opts
    gain_cap_iso: *gcap
device: mps
distill:
  checkpoint: runs/photo_high_iso_speed/r10_eval/mix_r10_r9p20.pt
  weights: model
  weight: 0.50
  min_weight: 0.15
  linear_weight: 1.0
  gamma_weight: 0.25
  chroma_weight: 0.04
  highlight_chroma_weight: 0.10
  highlight_threshold: 0.75
  protect_teacher_highlights: true
  eps: 1.0e-05
loss:
  kind: charbonnier
  eps: 1.0e-05
  linear_weight: 1.0
  gamma_weight: 0.25
  chroma_weight: 0.04
  chroma_lowpass_weight: 0.06
  chroma_lowpass_kernel: 4
  highlight_chroma_weight: 0.15
  highlight_threshold: 0.75
  green_balance_weight: 0.02
  green_dc_weight: 0.05
  green_dc_kernel: 16
model:
  arch: nafnet
  cond: none
  width: 24
  stage_widths: [24, 64, 128, 256, 512, 512]
  enc_blk_nums: [1, 1, 2, 3, 4]
  middle_blk_num: 6
  dec_blk_nums: [1, 1, 1, 1, 1]
  output_head: rggb
  resample: standard
seed: 20261124
threads: 2
training:
  amp: bf16
  batch_size: 16
  betas: [0.9, 0.99]
  checkpoint_every: 6000
  ema_decay: 0.999
  grad_accum: 1
  grad_clip: 1.0
  identity_init: true
  keep_checkpoints: 1
  log_every: 500
  lr: 0.0003
  min_lr: 1.0e-06
  progress: false
  run_dir: runs/photo_high_iso_speed/stage3_v2/arm0_control
  steps: 6000
  transpose_consistency_weight: 0.08
  transpose_consistency_fraction: 0.25
  warmup_steps: 400
  weight_decay: 0.0001
  workers: 4
