    calibration: calib/darks_physnoise_20261101.yaml
    cameras:
      x1d2: 0.55
      x1d2_electronic: 0.10
      a7m3: 0.20
      a5100: 0.15
    camera_options: *cam_opts
    gain_cap_iso: *gcap
  - augment: true
    crop_size: 128
    root: data
    exposure_range: *exp_range
    exposure_sampling: log
    bright_exposure_probability: 0.5
    identity_probability: 0.05
    channel_gain_probability: 0.5
    channel_gain_range: *cg_range
    clip_highlight_probability: 0.12
    clip_exposure_range: *clip_exp
    clip_ceiling_range: *clip_ceil
    bin_probability: 0.0
