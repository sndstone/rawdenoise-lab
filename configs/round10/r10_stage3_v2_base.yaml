# Round 10 Stage 3 (Council F7): Controlled v2 Architecture Ablation Base Config.
# Uses the unanimously approved Stage 2 (F6) data/loss recipe (with pre-noise clipping,
# code-grid snapping, floored highlight-chroma denominator, and per-sample low-ceiling
# teacher highlight protection where teacher targets blend to noiseless `clean` in
# clipped highlight cores). Only `model:` varies across Stage 3 ablation arms.
data:
  kind: mixed
  probabilities:
  - 0.60
  - 0.15
  - 0.10
  - 0.07
  - 0.08
  sources:
  - augment: true
    bin_factors: [2]
    bin_probability: 0.0
    bright_exposure_probability: 0.5
    channel_gain_probability: 0.5
    channel_gain_range: [0.4, 2.5]
    clip_highlight_probability: 0.12
    clip_exposure_range: [1.2, 3.0]
    clip_ceiling_range: [0.90, 1.09]
    column_relative_max: 0.15
    crop_size: 128
    defect_options:
      density_range: [1.0e-05, 0.0003]
    defect_probability: 0.5
    exposure_range: [0.015625, 1]
    exposure_sampling: log
    flat_options:
      equal_probability: 0.35
      gradient_max: 0.3
      gradient_probability: 0.5
      level_range: [0.001, 0.98]
      ratio_range: [0.3, 1.6]
    flat_probability: 0.06
    identity_probability: 0.05
    impulse_range: [1.0e-05, 0.005]
    impulse_sigma_range: [3.0, 30.0]
    kind: bootstrap
    manifest: data/bootstrap_binned/x1d2_bin4_train_r4.json
    read_range: [3.0e-05, 0.006]
    resite: false
    root: data
    row_max: 0.0005
    shot_range: [1.0e-05, 0.002]
  - augment: true
    bin_factors: [2]
    bin_probability: 0.0
    bright_exposure_probability: 0.35
    channel_gain_probability: 0.5
    channel_gain_range: [0.4, 2.5]
    clip_highlight_probability: 0.12
    clip_exposure_range: [1.2, 3.0]
    clip_ceiling_range: [0.90, 1.09]
    column_relative_max: 0.25
    crop_size: 128
    defect_options:
      density_range: [1.0e-05, 0.0004]
    defect_probability: 0.5
    exposure_range: [0.015625, 1]
    exposure_sampling: log
    flat_options:
      equal_probability: 0.35
      gradient_max: 0.3
      gradient_probability: 0.5
      level_range: [0.001, 0.98]
      ratio_range: [0.3, 1.6]
    flat_probability: 0.04
    identity_probability: 0.04
    impulse_range: [1.0e-05, 0.008]
    impulse_sigma_range: [3.0, 35.0]
    kind: bootstrap
    lag1_h_range: [0.0, 0.22]
    lag1_v_range: [0.0, 0.08]
    manifest: data/bootstrap_binned_a7/a7m3_bin4_train.json
    quantize_bits_choices: [12, 14, 16]
    read_range: [0.002, 0.022]
    resite: false
    root: data
    row_max: 0.002
    shot_range: [0.001, 0.022]
  - augment: true
    crop_size: 128
    root: data
    exposure_range: &exp_range [0.015625, 1]
    exposure_sampling: log
    bright_exposure_probability: 0.5
    identity_probability: 0.05
    channel_gain_probability: 0.5
    channel_gain_range: &cg_range [0.4, 2.5]
    clip_highlight_probability: 0.12
    clip_exposure_range: &clip_exp [1.2, 3.0]
    clip_ceiling_range: &clip_ceil [0.90, 1.09]
    bin_probability: 0.0
    bin_factors: &bf [2]
    defect_probability: 0.5
    defect_options: &def_opts
      density_range: [1.0e-05, 0.0003]
    resite: false
    kind: camera
    manifest: data/bootstrap_binned/x1d2_bin4_train_r4.json
    calibration: calib/darks_physnoise_20261101.yaml
    cameras:
      x1d2: 0.50
      x1d2_electronic: 0.10
      a7m3: 0.20
      a5100: 0.20
    camera_options: &cam_opts
      K_jitter_log: 0.3
      read_jitter_log: 0.15
      processed_probability: 0.12
      physics_options:
        banding: true
        quantization: true
        horizontal_correlation: true
        vertical_correlation: true
        moment_read: true
        fixed_seed: 20261121
    gain_cap_iso: &gcap
      x1d2: 6400
      x1d2_electronic: 6400
  - augment: true
    crop_size: 128
    root: data
    exposure_range: *exp_range
    exposure_sampling: log
    bright_exposure_probability: 0.5
