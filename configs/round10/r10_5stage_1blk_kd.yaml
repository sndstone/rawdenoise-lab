# Round 10: 5-Stage Slim-Stage-0 (1 Full-Res Detail Block) + Teacher-Guided KD.
# Benchmarked at 12.88 ms/tile (Core ML ALL, ~2x faster than r4_plain) on Apple M5 Pro,
# retaining the 5-stage receptive field (2x wider than r4_plain for high-ISO chroma blotches)
# while restoring 1 slim width=24 NAFBlock at full resolution (enc[0]=1, dec[-1]=1) for low-ISO
# micro-detail and bright flat-field accuracy.
data:
  kind: mixed
  probabilities:
  - 0.60
  - 0.15
  - 0.10
  - 0.07
  - 0.08
  sources:
  - augment: true
    bin_factors: [2]
    bin_probability: 0.0
    bright_exposure_probability: 0.5
    channel_gain_probability: 0.5
    channel_gain_range: [0.4, 2.5]
    column_relative_max: 0.15
    crop_size: 128
    defect_options:
      density_range: [1.0e-05, 0.0003]
    defect_probability: 0.5
    exposure_range: [0.015625, 1]
    exposure_sampling: log
    flat_options:
      equal_probability: 0.35
      gradient_max: 0.3
      gradient_probability: 0.5
      level_range: [0.001, 0.98]
      ratio_range: [0.3, 1.6]
    flat_probability: 0.06
    identity_probability: 0.05
    impulse_range: [1.0e-05, 0.005]
    impulse_sigma_range: [3.0, 30.0]
    kind: bootstrap
    manifest: data/bootstrap_binned/x1d2_bin4_train_r4.json
    read_range: [3.0e-05, 0.006]
    resite: false
    root: data
    row_max: 0.0005
    shot_range: [1.0e-05, 0.002]
  - augment: true
    bin_factors: [2]
    bin_probability: 0.0
    bright_exposure_probability: 0.35
    channel_gain_probability: 0.5
    channel_gain_range: [0.4, 2.5]
    column_relative_max: 0.25
    crop_size: 128
    defect_options:
      density_range: [1.0e-05, 0.0004]
    defect_probability: 0.5
    exposure_range: [0.015625, 1]
    exposure_sampling: log
    flat_options:
      equal_probability: 0.35
      gradient_max: 0.3
      gradient_probability: 0.5
      level_range: [0.001, 0.98]
      ratio_range: [0.3, 1.6]
    flat_probability: 0.04
    identity_probability: 0.04
    impulse_range: [1.0e-05, 0.008]
    impulse_sigma_range: [3.0, 35.0]
    kind: bootstrap
    lag1_h_range: [0.0, 0.22]
    lag1_v_range: [0.0, 0.08]
    manifest: data/bootstrap_binned_a7/a7m3_bin4_train.json
    quantize_bits_choices: [12, 14, 16]
    read_range: [0.002, 0.022]
    resite: false
    root: data
    row_max: 0.002
    shot_range: [0.001, 0.022]
  - augment: true
    crop_size: 128
    root: data
    exposure_range: &exp_range [0.015625, 1]
    exposure_sampling: log
    bright_exposure_probability: 0.5
    identity_probability: 0.05
    channel_gain_probability: 0.5
    channel_gain_range: &cg_range [0.4, 2.5]
    bin_probability: 0.0
    bin_factors: &bf [2]
    defect_probability: 0.5
    defect_options: &def_opts
      density_range: [1.0e-05, 0.0003]
    resite: false
    kind: camera
    manifest: data/bootstrap_binned/x1d2_bin4_train_r4.json
    calibration: calib/darks_physnoise_20261101.yaml
    cameras:
      x1d2: 0.50
      x1d2_electronic: 0.10
      a7m3: 0.20
      a5100: 0.20
    camera_options: &cam_opts
      K_jitter_log: 0.3
      read_jitter_log: 0.15
      processed_probability: 0.12
      physics_options:
        banding: true
        quantization: true
        horizontal_correlation: true
        vertical_correlation: true
        moment_read: true
        fixed_seed: 20261121
    gain_cap_iso: &gcap
      x1d2: 6400
      x1d2_electronic: 6400
  - augment: true
    crop_size: 128
    root: data
    exposure_range: *exp_range
    exposure_sampling: log
    bright_exposure_probability: 0.5
    identity_probability: 0.05
    channel_gain_probability: 0.5
    channel_gain_range: *cg_range
    bin_probability: 0.0
    bin_factors: *bf
    defect_probability: 0.5
    defect_options: *def_opts
    resite: false
    kind: camera
    manifest: data/bootstrap_binned/x1d2_bin2_train_r4.json
    calibration: calib/darks_physnoise_20261101.yaml
    cameras:
      x1d2: 0.55
      x1d2_electronic: 0.10
      a7m3: 0.20
      a5100: 0.15
    camera_options: *cam_opts
    gain_cap_iso: *gcap
  - augment: true
    crop_size: 128
    root: data
    exposure_range: *exp_range
    exposure_sampling: log
    bright_exposure_probability: 0.5
    identity_probability: 0.05
    channel_gain_probability: 0.5
    channel_gain_range: *cg_range
    bin_probability: 0.0
    bin_factors: *bf
    defect_probability: 0.5
    defect_options: *def_opts
    resite: false
    kind: camera
    manifest: data/bootstrap_binned_a7/a7m3_bin4_train.json
    calibration: calib/darks_physnoise_20261101.yaml
    cameras:
      a7m3: 0.50
      a5100: 0.50
    camera_options: *cam_opts
    gain_cap_iso: *gcap
device: cuda:0
distill:
  checkpoint: runs/photo_high_iso_speed/r10_eval/mix_r10_r9p20.pt
  weights: model
  weight: 0.50
  min_weight: 0.15
  linear_weight: 1.0
  gamma_weight: 0.25
  eps: 1.0e-05
loss:
  kind: charbonnier
  eps: 1.0e-05
  linear_weight: 1.0
  gamma_weight: 0.25
  chroma_weight: 0.04
  chroma_lowpass_weight: 0.06
  chroma_lowpass_kernel: 4
  green_balance_weight: 0.02
model:
  arch: nafnet
  cond: none
  width: 24
  stage_widths: [24, 64, 128, 256, 512, 512]
  enc_blk_nums: [1, 1, 2, 3, 4]
  middle_blk_num: 6
  dec_blk_nums: [1, 1, 1, 1, 1]
seed: 20261122
threads: 2
training:
  amp: bf16
  batch_size: 16
  betas: [0.9, 0.99]
  checkpoint_every: 24000
  ema_decay: 0.999
  grad_accum: 1
  grad_clip: 1.0
  identity_init: true
  keep_checkpoints: 2
  log_every: 250
  lr: 0.0003
  min_lr: 1.0e-06
  progress: false
  run_dir: runs/photo_high_iso_speed/r10_5stage_1blk_kd
  steps: 120000
  warmup_steps: 1000
  weight_decay: 0.0001
  workers: 6
