[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "denoise_lab"
version = "0.2.0"
description = "Clean-room Bayer RAW denoising CLI and training tools"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.24", "rawpy>=0.19", "tifffile", "pyyaml", "tqdm"]

[project.urls]
Repository = "https://github.com/sndstone/rawdenoise-lab"

[project.scripts]
rawdenoise = "denoise_lab.cli:main"
rawdenoise-fetch = "denoise_lab.cli:fetch_main"

[project.optional-dependencies]
torch = ["torch>=2.2"]
train = ["torch>=2.2"]
dev = ["torch>=2.2", "pytest>=8", "pillow"]
coreml = ["coremltools"]
export = ["torch>=2.2", "coremltools", "scikit-learn", "onnx", "onnxscript", "onnxruntime>=1.17"]
onnx = ["onnxruntime>=1.17"]
onnx-gpu = ["onnxruntime-gpu>=1.17"]
directml = ["onnxruntime-directml>=1.17"]
audit = ["matplotlib>=3.8", "pillow", "exifread>=3"]
nas = ["impacket>=0.13", "exifread>=3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["denoise_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Catch syntax errors and unambiguous name/control-flow errors.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

