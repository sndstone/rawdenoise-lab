[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "denoise_lab"
version = "0.1.0"
description = "Experimental Bayer RAW denoising CLI and training tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.24", "rawpy>=0.19", "tifffile", "pyyaml", "tqdm"]

[project.urls]
Repository = "https://github.com/sndstone/rawdenoise-lab"

[project.scripts]
rawdenoise = "denoise_lab.cli:main"
rawdenoise-demo = "denoise_lab.demo:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pillow"]
export = ["coremltools", "onnx", "onnxscript", "onnxruntime>=1.17"]
onnx = ["onnxruntime>=1.17"]
onnx-gpu = ["onnxruntime-gpu>=1.17"]
directml = ["onnxruntime-directml>=1.17"]
audit = ["matplotlib>=3.8", "pillow", "exifread>=3"]
nas = ["impacket>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
